<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 20 - Hiệu ứng ảnh CSS3</title>
    <link rel="stylesheet" href="bai20.css">
</head>
<body>

    <svg style="display: none;">
        <defs>
            <filter id="wave-filter">
                <feTurbulence type="turbulence" baseFrequency="0.02 0.05" numOctaves="2" result="turbulence" />
                <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="20" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <div class="card">
        <img id="myImg" src="Anh/Bai20/hoahong.gif" alt="Hoa hồng" class="effect-gray">
        <div class="subtext">Special For You</div>
    </div>

    <div class="button-group">
        <button class="active" onclick="applyEffect(this, 'effect-gray')">Gray</button>
        <button onclick="applyEffect(this, 'effect-xray')">Xray</button>
        <button onclick="applyEffect(this, 'effect-invert')">Invert</button>
        <button onclick="applyEffect(this, 'effect-fliph')">FlipH</button>
        <button onclick="applyEffect(this, 'effect-flipv')">FlipV</button>
        <button onclick="applyEffect(this, 'effect-glow')">Glow</button>
        <button onclick="applyEffect(this, 'effect-shadow')">Shadow</button>
        <button onclick="applyEffect(this, 'effect-boldshadow')">Bold Shadow</button>
        <button onclick="applyEffect(this, 'effect-dropshadow')">DropShadow</button>
        <button onclick="applyEffect(this, 'effect-blur')">Blur</button>
        <button onclick="applyEffect(this, 'effect-wave')">Wave</button>
        <button onclick="applyEffect(this, 'effect-mask')">Mask</button>
        <button onclick="applyEffect(this, 'effect-alpha')">Alpha</button>
    </div>

    <script>
        function applyEffect(btn, effectClass) {
            document.querySelectorAll('.button-group button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const img = document.getElementById('myImg');
            img.className = effectClass;
        }
    </script>

</body>
</html>
