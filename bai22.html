<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 22 - Chế độ Tối / Sáng</title>
    <link rel="stylesheet" href="bai22.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>Chế độ Tối / Sáng</h1>
            <label class="switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider"></span>
            </label>
        </header>

        <div class="card">
            <h3 class="card-title">Biến CSS (CSS Variables)</h3>
            <p class="card-text">Toàn bộ màu sắc được khai báo trong <code>:root</code> và ghi đè bằng class <code>.toi</code>.</p>
        </div>

        <div class="card">
            <h3 class="card-title">Chuyển đổi bằng JavaScript</h3>
            <p class="card-text">Nút gạt thêm/bỏ class <code>.toi</code> trên <code>&lt;body&gt;</code> — mọi thành phần tự đổi màu.</p>
        </div>

        <div class="card">
            <h3 class="card-title">Chuyển màu mượt</h3>
            <p class="card-text">Dùng transition để màu nền và chữ chuyển dần, không bị giật.</p>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        
        toggleBtn.addEventListener('change', function () {
            if (this.checked) {
                document.body.classList.add('toi');
            } else {
                document.body.classList.remove('toi');
            }
        });
    </script>

</body>
</html>
