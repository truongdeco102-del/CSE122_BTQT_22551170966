<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 12 — In lịch</title>
  <link rel="stylesheet" href="bai12.css">
</head>
<body>

  <div class="container">
    <!-- Khung chính ô lịch -->
    <div class="calendar-card">
      
      <!-- Khung hiển thị thông tin ngày tháng -->
      <div class="calendar-display">
        <div id="yearDisplay" class="year-text">2026</div>
        <div id="monthDisplay" class="month-text">Tháng 12</div>
        <div id="dateDisplay" class="date-text">24</div>
        <div id="dayDisplay" class="day-text">Thứ hai</div>
      </div>

      <!-- Lời chào theo buổi -->
      <div id="greetingDisplay" class="greeting-text">
        Chào buổi sáng!
      </div>

      <!-- Form nhập ngày tháng -->
      <div class="input-form-box">
        <div class="form-group">
          <label>Ngày</label>
          <input type="number" id="inputDay" value="24" min="1" max="31">
        </div>
        <div class="form-group">
          <label>Tháng</label>
          <input type="number" id="inputMonth" value="12" min="1" max="12">
        </div>
        <div class="form-group">
          <label>Năm</label>
          <input type="number" id="inputYear" value="2026">
        </div>
        <button id="btnPrint" class="btn-print">In lịch</button>
      </div>

    </div>
  </div>

  <script src="bai12.js"></script>
</body>
</html>
