<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 30 - Bảng điều khiển Dashboard</title>
    <!-- Nhúng CSS Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Khung tổng layout dạng flex -->
    <div class="d-flex" style="min-height: 100vh;">
        
        <!-- Sidebar bên trái (Nền #212529, rộng 230px) -->
        <div class="bg-dark text-white p-3" style="width: 230px; flex-shrink: 0;">
            <h5 class="fw-bold mb-4 px-2">CSE.TLU Admin</h5>
            <ul class="nav nav-pills flex-column gap-1">
                <li class="nav-item"><a href="#" class="nav-link active bg-primary text-white">Bảng điều khiển</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white-50">Bài tập</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white-50">Sinh viên</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white-50">Điểm số</a></li>
            </ul>
        </div>

        <!-- Phần nội dung chính bên phải -->
        <div class="flex-grow-1 p-4">
            
            <!-- Header nội dung -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0">Bảng điều khiển</h4>
                <div>
                    <span class="badge bg-warning text-dark me-2">3 bài mới</span>
                    <button class="btn btn-primary btn-sm">Xuất báo cáo</button>
                </div>
            </div>

            <!-- 4 Thẻ thống kê (col-md-3) -->
            <div class="row g-3 mb-4">
                <!-- Thẻ 1 -->
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm p-3">
                        <small class="text-muted">Sinh viên</small>
                        <h3 class="fw-bold my-1">128</h3>
                        <div class="progress" style="height: 4px;">
                            <div class="progress-bar bg-primary" style="width: 70%"></div>
                        </div>
                    </div>
                </div>
                <!-- Thẻ 2 -->
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm p-3">
                        <small class="text-muted">Đã nộp</small>
                        <h3 class="fw-bold my-1">96</h3>
                        <div class="progress" style="height: 4px;">
                            <div class="progress-bar bg-success" style="width: 85%"></div>
                        </div>
                    </div>
                </div>
                <!-- Thẻ 3 -->
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm p-3">
                        <small class="text-muted">Chưa nộp</small>
                        <h3 class="fw-bold my-1">32</h3>
                        <div class="progress" style="height: 4px;">
                            <div class="progress-bar bg-danger" style="width: 30%"></div>
                        </div>
                    </div>
                </div>
                <!-- Thẻ 4 -->
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm p-3">
                        <small class="text-muted">Điểm TB</small>
                        <h3 class="fw-bold my-1">7.8</h3>
                        <div class="progress" style="height: 4px;">
                            <div class="progress-bar bg-warning" style="width: 78%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Danh sách tiến độ theo chương -->
            <div class="card border-0 shadow-sm p-3">
                <h6 class="fw-bold mb-3">Tiến độ theo chương</h6>
                <ul class="list-group list-group-flush">
                    
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                        <span>Chương 1 — HTML5</span>
                        <span class="badge bg-success">100%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                        <span>Chương 2 — JavaScript</span>
                        <span class="badge bg-primary">82%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                        <span>Chương 3 — CSS3</span>
                        <span class="badge bg-info text-dark">74%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                        <span>Chương 4 — Bootstrap 5</span>
                        <span class="badge bg-secondary">45%</span>
                    </li>

                </ul>
            </div>

        </div>

    </div>

    <!-- Nhúng JS Bootstrap 5 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
