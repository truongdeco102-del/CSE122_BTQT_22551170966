<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 23 - Thư viện ảnh Hiệu ứng Hover</title>
    <link rel="stylesheet" href="bai23.css">
</head>
<body>

    <div class="container">
        <!-- Tiêu đề thư viện -->
        <header class="header">
            <h1>Thư viện ảnh — Hiệu ứng Hover</h1>
            <p>Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú thích.</p>
        </header>

        <!-- Lưới 6 ảnh (CSS Grid) -->
        <div class="gallery-grid">
            
            <!-- Ảnh 1 -->
            <div class="gallery-item">
                <img src="anh15.png" alt="Vịnh Hạ Long">
                <div class="overlay">
                    <span class="caption">Vịnh Hạ Long</span>
                </div>
            </div>

            <!-- Ảnh 2 -->
            <div class="gallery-item">
                <img src="anh16.png" alt="Hang Sơn Đoòng">
                <div class="overlay">
                    <span class="caption">Hang Sơn Đoòng</span>
                </div>
            </div>

            <!-- Ảnh 3 -->
            <div class="gallery-item">
                <img src="anh17.png" alt="Thác Bản Giốc">
                <div class="overlay">
                    <span class="caption">Thác Bản Giốc</span>
                </div>
            </div>

            <!-- Ảnh 4 -->
            <div class="gallery-item">
                <img src="anh18.png" alt="Fansipan">
                <div class="overlay">
                    <span class="caption">Fansipan</span>
                </div>
            </div>

            <!-- Ảnh 5 -->
            <div class="gallery-item">
                <img src="anh19.png" alt="Đồng bằng sông Cửu Long">
                <div class="overlay">
                    <span class="caption">Đồng bằng sông Cửu Long</span>
                </div>
            </div>

            <!-- Ảnh 6 -->
            <div class="gallery-item">
                <img src="anh20.png" alt="Động Phong Nha">
                <div class="overlay">
                    <span class="caption">Động Phong Nha</span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
