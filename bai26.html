<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 26 - Đăng ký tham gia CLB Lập trình Web</title>
    <!-- Nhúng CSS Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <!-- Thẻ Card chứa Form -->
                <div class="card shadow border-0 rounded-4 overflow-hidden">
                    
                    <!-- Tiêu đề đề thẻ (Header nền #198754 - bg-success, chữ trắng, căn giữa) -->
                    <div class="card-header bg-success text-white text-center py-4">
                        <h3 class="mb-0 fw-bold">Đăng ký tham gia CLB Lập trình Web</h3>
                    </div>

                    <!-- Phần thân Form -->
                    <div class="card-body p-4 p-md-5">
                        <form>
                            
                            <!-- Hàng 1: Họ và tên & Mã sinh viên -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="fullname" class="form-label fw-semibold">Họ và tên</label>
                                    <input type="text" class="form-control" id="fullname" placeholder="Nguyễn Văn A" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="studentId" class="form-label fw-semibold">Mã sinh viên</label>
                                    <input type="text" class="form-control" id="studentId" placeholder="22xxxxxx" required>
                                </div>
                            </div>

                            <!-- Hàng 2: Email & Số điện thoại -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="email" class="form-label fw-semibold">Email</label>
                                    <input type="email" class="form-control" id="email" placeholder="sv@tlu.edu.vn" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="phone" class="form-label fw-semibold">Số điện thoại</label>
                                    <input type="tel" class="form-control" id="phone" placeholder="09xxxxxxxx" required>
                                </div>
                            </div>

                            <!-- Trình độ (Radio buttons - form-check-inline) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold d-block">Trình độ</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="level" id="level1" value="CoBan" checked>
                                    <label class="form-check-label" for="level1">Cơ bản</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="level" id="level2" value="Kha">
                                    <label class="form-check-label" for="level2">Khá</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="level" id="level3" value="Tot">
                                    <label class="form-check-label" for="level3">Tốt</label>
                                </div>
                            </div>

                            <!-- Chọn lớp (Select - form-select) -->
                            <div class="mb-3">
                                <label for="classSelect" class="form-label fw-semibold">Chọn lớp</label>
                                <select class="form-select" id="classSelect" required>
                                    <option value="" selected disabled>-- Chọn lớp của bạn --</option>
                                    <option value="67CNTT1">67CNTT1</option>
                                    <option value="67CNTT2">67CNTT2</option>
                                    <option value="67CNTT3">67CNTT3</option>
                                </select>
                            </div>

                            <!-- Cam kết (Checkbox) -->
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="commitCheck" required>
                                <label class="form-check-label text-secondary" for="commitCheck">Tôi cam kết tự làm bài và quay video OBS</label>
                            </div>

                            <!-- Nút bấm (Nhập lại & Đăng ký) -->
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <button type="reset" class="btn btn-outline-secondary w-100 py-2 fw-semibold">Nhập lại</button>
                                </div>
                                <div class="col-md-6">
                                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Đăng ký</button>
                                </div>
                            </div>

                        </form>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Nhúng JS Bootstrap 5 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
