<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên hệ với chúng tôi</title>
  <link rel="stylesheet" href="bai10.css">
</head>
<body>

  <div class="box">
    <!-- Phần Tiêu đề -->
     <div class="col-dis"> </div>
    <div class="head">
      <div class="title">Liên hệ với chúng tôi</div>
      <div class="desc">Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</div>
    </div>

    <!-- Phần Nội dung Form -->
    <div class="body">
        
      <div class="col">
        <div class="lbl">Họ và tên</div>
        <input class="inp" value="Nguyễn Văn An">
      </div>
      <div class="col">
        <div class="lbl">Email</div>
        <input class="inp" value="an.nv@tlu.edu.vn">
      </div>
      
      <div class="col">
        <div class="lbl">Số điện thoại</div>
        <input class="inp" value="0987 654 321">
      </div>
      <div class="col">
        <div class="lbl">Chủ đề</div>
        <select class="inp"><option>Hỏi về khoá học</option></select>
      </div>

      <div class="col full">
        <div class="lbl">Nội dung</div>
        <textarea class="inp" rows="4">Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ.</textarea>
      </div>

      <div class="col full chk-row">
        <input type="checkbox" checked>
        <div>Tôi đồng ý nhận email<br>phản hồi.</div>
      </div>

      <div class="col full btn-row">
        <button class="btn btn-submit">Gửi liên hệ</button>
        <button class="btn btn-reset">Nhập lại</button>
      </div>
    </div>
  </div>

</body>
</html>
